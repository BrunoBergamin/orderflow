spring:
  application:
    name: orderflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderflow}
    username: ${DB_USERNAME:orderflow}
    password: ${DB_PASSWORD:orderflow}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    # Desligado de proposito: com open-in-view ligado, a sessao fica aberta ate o fim da
    # resposta e qualquer getter LAZY vira uma consulta escondida na camada web.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Carrega colecoes LAZY de varias linhas em um unico IN (...): mata o N+1 das listagens.
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false

  # Java 21: cada requisicao HTTP roda em uma virtual thread, entao esperar por I/O
  # (banco, gateway de pagamento) nao prende uma thread de plataforma.
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: orderflow
  tracing:
    sampling:
      # 100% em desenvolvimento para que todo pedido apareca no rastro. Em producao com
      # volume alto isso se reduz -- amostrar tudo custa CPU e armazenamento sem responder
      # nenhuma pergunta a mais.
      probability: ${TRACING_SAMPLE_RATE:1.0}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

orderflow:
  security:
    jwt:
      # Valor de desenvolvimento. Em qualquer outro ambiente entra por variavel de ambiente.
      secret: ${JWT_SECRET:orderflow-chave-local-de-desenvolvimento-nao-use-em-producao}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
      issuer: orderflow
  outbox:
    batch-size: 50
    poll-interval-ms: 2000
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    topic: orderflow.order-events
    consumer-group: orderflow-notifications
    send-timeout-seconds: 10
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}

logging:
  level:
    br.com.bergamin.orderflow: INFO
    org.hibernate.orm.jdbc.bind: ${SQL_PARAM_LOG_LEVEL:WARN}
